{% extends "base.html" %}
{% block title %}Error {{ code }} — Academic Deadline Radar{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-wrap">
    <div class="auth-card" style="text-align:center;padding:48px 40px">
      <div style="font-size:52px;margin-bottom:16px">
        {% if code == 404 %}🔍{% elif code == 403 %}🚫{% else %}⚠️{% endif %}
      </div>
      <h2 style="margin-bottom:8px">{{ code }}</h2>
      <p class="auth-sub" style="margin-bottom:28px">{{ message }}</p>
      <a href="{{ url_for('dashboard') }}" class="btn-primary" style="display:inline-block;text-decoration:none;width:auto;padding:12px 28px">
        Back to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
